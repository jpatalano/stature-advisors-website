<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="css/style.css" />
  <script src="js/main.js" defer></script>
</head>
<body>
<nav class="nav" role="navigation" aria-label="Main navigation">
  <div class="container">
    <div class="nav__inner">
      <a href="/" class="nav__logo" aria-label="Stature Advisors home">
        <svg width="210" height="28" viewBox="0 0 210 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <text x="0" y="20" font-family="Cabinet Grotesk,Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="500" letter-spacing="3.5" fill="#3fa8b0">STATURE</text>
          <rect x="88" y="3" width="1.5" height="22" fill="#3fa8b0"/>
          <text x="96" y="20" font-family="Cabinet Grotesk,Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="500" letter-spacing="3.5" fill="#3fa8b0">ADVISORS</text>
        </svg>
      </a>
      <div class="nav__controls">
        <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </div>
</nav>
<main>
  <section style="padding-top:calc(68px + 8rem);padding-bottom:8rem;text-align:center;">
    <div class="container--narrow">
      <div style="width:56px;height:56px;background:var(--color-primary-light);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto var(--space-6);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h1 style="font-family:var(--font-display);font-size:var(--text-2xl);font-weight:800;color:var(--color-text);margin-bottom:var(--space-4);">Message received.</h1>
      <p style="font-size:var(--text-base);color:var(--color-text-muted);max-width:44ch;margin:0 auto var(--space-8);line-height:1.7;">We'll review your inquiry and be in touch within one business day. If your question is urgent, mention it in a follow-up.</p>
      <a href="/" class="btn btn--ghost">Back to Home</a>
    </div>
  </section>
</main>
<footer class="footer" role="contentinfo">
  <div class="container">
    <div class="footer__bottom">
      <div class="footer__legal">&copy; 2026 Stature Advisors LLC.</div>
    </div>
  </div>
